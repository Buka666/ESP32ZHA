name: Build firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.build_type }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6]
        build_type: [Release, Debug]

    container:
      image: espressif/idf:release-v5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESP-IDF build
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-${{ matrix.build_type }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
